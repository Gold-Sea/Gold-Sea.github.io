# 官方 Jekyll → GitHub Pages 部署工作流(Actions 模式,绕开经典 branch 部署管线)
# 需要在 Settings → Pages 把 Source 设为 "GitHub Actions"
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Pages 后端偶发卡死:上一次部署永远停在 in progress,后续所有部署请求都被
      # 400 拒绝("due to in progress deployment. Please cancel <sha> first")。
      # 部署前先取消所有残留部署。concurrency 组保证此刻不可能有健康部署在跑,取消是安全的。
      # 注:deploy-pages 的 timeout 上限就是 600000ms(10 分钟),设更大会被 clamp,调超时救不了。
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # 必须跳过本次运行自己的 sha:deploy job 启动时 GitHub 就已为它创建部署记录,
          # 取消它会把马上要创建的新部署一起干掉("Deployment cancelled")
          cancelled=0
          for sha in $(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/deployments?environment=github-pages&per_page=10" \
              | jq -r '.[].sha' | sort -u); do
            if [ "$sha" = "$CURRENT_SHA" ]; then
              echo "skip $sha (本次运行自己)"
              continue
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/pages/deployments/$sha/cancel")
            echo "cancel $sha -> HTTP $code (404/409/422 表示该 sha 没有卡住的部署,属正常)"
            [ "$code" = "200" ] && cancelled=1
          done
          # 取消是异步生效的;若真取消了东西,等后端落定,避免波及紧接着创建的新部署
          if [ "$cancelled" = "1" ]; then
            echo "waiting 20s for cancellation to settle..."
            sleep 20
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
